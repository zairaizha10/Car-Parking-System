{% extends 'layout.html' %}

{% block content %}

<div class="form-box">

    <h1>Login</h1>

    <form method="POST">

        <input type="email"
        name="email"
        placeholder="Enter Email"
        required>

        <input type="password"
        name="password"
        placeholder="Enter Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
