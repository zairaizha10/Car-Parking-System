{% extends 'layout.html' %}

{% block content %}

<div class="form-box">

    <h1>Register</h1>

    <form method="POST">

        <input type="text"
        name="username"
        placeholder="Enter Username"
        required>

        <input type="email"
        name="email"
        placeholder="Enter Email"
        required>

        <input type="password"
        name="password"
        placeholder="Enter Password"
        required>

        <button type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
